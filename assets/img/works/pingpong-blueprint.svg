<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="bpTitle bpDesc">
  <title id="bpTitle">乒乓球发球机侧视结构示意图</title>
  <desc id="bpDesc">由供球漏斗、双轮摩擦发射机构、舵机云台和触摸屏控制组成的乒乓球发球机结构草图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071019"/>
      <stop offset="0.55" stop-color="#081625"/>
      <stop offset="1" stop-color="#050b13"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#153350"/>
      <stop offset="1" stop-color="#0b1c2e"/>
    </linearGradient>
    <linearGradient id="trajectory" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b1a" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#ff6b1a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffb066" stop-opacity=".15"/>
    </linearGradient>
    <radialGradient id="screenGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#7dd3fc" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <pattern id="gridMajor" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#7dd3fc" stroke-opacity=".1" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#38bdf8" fill-opacity=".75"/>
    </marker>
    <style>
      .label { font-family: "Cascadia Code", Consolas, "Microsoft YaHei", monospace; }
      .dash { stroke-dasharray: 7 9; animation: flow 2.4s linear infinite; }
      .pulse { animation: pulse 2.6s ease-in-out infinite; transform-origin: 302px 357px; }
      @keyframes flow { to { stroke-dashoffset: -32; } }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .dash, .pulse { animation: none; } }
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <rect width="800" height="600" fill="url(#gridMajor)"/>
  <ellipse cx="470" cy="240" rx="300" ry="220" fill="#0c3b5e" opacity=".22"/>

  <!-- drawing frame -->
  <rect x="18" y="18" width="764" height="564" fill="none" stroke="#7dd3fc" stroke-opacity=".22"/>
  <g stroke="#7dd3fc" stroke-opacity=".55" stroke-width="2" fill="none">
    <path d="M18 44V18h26M756 18h26v26M782 556v26h-26M44 582H18v-26"/>
  </g>

  <!-- drawing header -->
  <text x="42" y="48" class="label" font-size="10" fill="#38bdf8" letter-spacing="2">FIG. 01 / SIDE ELEVATION</text>
  <text x="42" y="76" font-size="19" font-weight="700" fill="#e6f3ff" letter-spacing="1">乒乓球发球机 · 结构草图</text>
  <line x1="42" y1="90" x2="250" y2="90" stroke="#38bdf8" stroke-opacity=".45"/>
  <text x="42" y="108" class="label" font-size="9.5" fill="#7d9db8" letter-spacing="1.2">PB-01 / SERVO + FRICTION WHEEL LAUNCHER</text>

  <!-- dimension: height -->
  <g stroke="#38bdf8" stroke-opacity=".45" stroke-width="1">
    <line x1="112" y1="150" x2="112" y2="474" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="112" y1="150" x2="146" y2="150"/>
    <line x1="112" y1="474" x2="146" y2="474"/>
  </g>
  <text x="101" y="316" class="label" font-size="9.5" fill="#7d9db8" transform="rotate(-90 101 316)" text-anchor="middle" letter-spacing="1">H 480</text>

  <!-- base -->
  <g>
    <rect x="150" y="455" width="420" height="18" rx="5" fill="url(#metal)" stroke="#2c6e91"/>
    <rect x="176" y="473" width="58" height="9" rx="3" fill="#0a1726" stroke="#24506d"/>
    <rect x="486" y="473" width="58" height="9" rx="3" fill="#0a1726" stroke="#24506d"/>
    <line x1="160" y1="462" x2="560" y2="462" stroke="#7dd3fc" stroke-opacity=".18"/>
    <circle cx="160" cy="464" r="2.2" fill="#38bdf8" fill-opacity=".8"/>
    <circle cx="560" cy="464" r="2.2" fill="#38bdf8" fill-opacity=".8"/>
  </g>

  <!-- column + gusset -->
  <path d="M330 300h44v155h-44z" fill="url(#metal)" stroke="#2c6e91"/>
  <path d="M330 390l-24 65h24zM374 390l24 65h-24z" fill="#0d2136" stroke="#24506d"/>
  <line x1="338" y1="310" x2="338" y2="448" stroke="#7dd3fc" stroke-opacity=".18"/>
  <line x1="366" y1="310" x2="366" y2="448" stroke="#7dd3fc" stroke-opacity=".12"/>

  <!-- control box -->
  <g>
    <rect x="240" y="330" width="112" height="88" rx="7" fill="url(#metal)" stroke="#2c6e91"/>
    <rect x="250" y="340" width="92" height="58" rx="3" fill="#062033" stroke="#38bdf8" stroke-opacity=".55"/>
    <ellipse cx="296" cy="369" rx="48" ry="30" fill="url(#screenGlow)" opacity=".5"/>
    <text x="296" y="358" text-anchor="middle" font-size="8.5" fill="#7dd3fc" font-family="Microsoft YaHei, sans-serif">乒乓球发球机</text>
    <g fill="#38bdf8" fill-opacity=".55">
      <rect x="258" y="368" width="22" height="7" rx="1"/>
      <rect x="286" y="368" width="22" height="7" rx="1"/>
      <rect x="314" y="368" width="20" height="7" rx="1"/>
      <rect x="258" y="381" width="22" height="7" rx="1"/>
      <rect x="286" y="381" width="22" height="7" rx="1"/>
      <rect x="314" y="381" width="20" height="7" rx="1" fill="#ff6b1a" fill-opacity=".65"/>
    </g>
    <circle cx="332" cy="408" r="4.5" fill="none" stroke="#ff6b1a"/>
    <circle cx="332" cy="408" r="1.6" fill="#ff6b1a"/>
    <circle cx="302" cy="357" r="2.4" fill="#7dffcf" class="pulse" filter="url(#softGlow)"/>
  </g>

  <!-- pan servo -->
  <g>
    <circle cx="352" cy="286" r="34" fill="url(#metal)" stroke="#2c6e91"/>
    <circle cx="352" cy="286" r="24" fill="#0b1c2e" stroke="#38bdf8" stroke-opacity=".35"/>
    <circle cx="352" cy="286" r="9" fill="#0d2b44" stroke="#ff6b1a" stroke-opacity=".85"/>
    <circle cx="352" cy="286" r="2.6" fill="#ff6b1a"/>
    <g stroke="#7dd3fc" stroke-opacity=".4" stroke-width="1.5">
      <path d="M330 260l-7-8M374 260l7-8M316 286h-10M388 286h10"/>
    </g>
    <path d="M352 252v-16" stroke="#2c6e91"/>
  </g>

  <!-- tilt arm -->
  <path d="M352 286l84-46 9 18-84 46z" fill="url(#metal)" stroke="#2c6e91"/>
  <circle cx="432" cy="244" r="6" fill="#0b1c2e" stroke="#38bdf8" stroke-opacity=".6"/>
  <circle cx="432" cy="244" r="1.8" fill="#38bdf8"/>

  <!-- launcher head: single friction wheel inside a curved guide -->
  <g>
    <rect x="436" y="196" width="16" height="68" rx="5" fill="#0d2136" stroke="#2c6e91"/>
    <circle cx="492" cy="202" r="40" fill="#0c2137" stroke="#2c6e91" stroke-width="1.5"/>
    <circle cx="492" cy="202" r="31" fill="url(#metal)" stroke="#38bdf8" stroke-opacity=".55" stroke-width="1.2"/>
    <g stroke="#7dd3fc" stroke-opacity=".5" fill="none">
      <circle cx="492" cy="202" r="20"/>
      <g stroke-opacity=".32">
        <path d="M492 171v62M461 202h62M470 180l44 44M514 180l-44 44"/>
      </g>
    </g>
    <circle cx="492" cy="202" r="5" fill="#0d2b44" stroke="#ff6b1a" stroke-opacity=".8"/>
    <path d="M466 238c8 20 30 30 52 24" fill="none" stroke="#2c6e91" stroke-width="9" stroke-linecap="round"/>
    <path d="M466 238c8 20 30 30 52 24" fill="none" stroke="#0a1726" stroke-width="4" stroke-linecap="round"/>
    <circle cx="492" cy="247" r="11" fill="#f6fbff" stroke="#dbeafe"/>
    <path d="M483 242c6 2 12 2 18 0" stroke="#ffb066" stroke-opacity=".9" fill="none" stroke-width="1.4"/>
    <path d="M520 250l26-2M516 262l22 5" stroke="#ff6b1a" stroke-opacity=".6" stroke-width="1.5"/>
  </g>

  <!-- hopper -->
  <g>
    <path d="M556 104h96l-27 68h-42z" fill="#0e2740" fill-opacity=".85" stroke="#2c6e91"/>
    <path d="M562 112h84" stroke="#7dd3fc" stroke-opacity=".35"/>
    <g fill="#f6fbff" stroke="#dbeafe" stroke-opacity=".8">
      <circle cx="584" cy="122" r="7"/>
      <circle cx="604" cy="118" r="7"/>
      <circle cx="624" cy="124" r="7"/>
      <circle cx="594" cy="142" r="7"/>
      <circle cx="616" cy="144" r="7"/>
      <circle cx="604" cy="162" r="7"/>
    </g>
    <path d="M604 172c0 22-30 24-42 40" fill="none" stroke="#2c6e91" stroke-width="7" stroke-linecap="round"/>
    <path d="M604 172c0 22-30 24-42 40" fill="none" stroke="#0a1726" stroke-width="3" stroke-linecap="round"/>
    <g fill="#f6fbff">
      <circle cx="598" cy="188" r="4.6"/>
      <circle cx="584" cy="200" r="4.6"/>
      <circle cx="570" cy="212" r="4.6"/>
    </g>
    <text x="650" y="100" class="label" font-size="10.5" fill="#7dd3fc">01 供球漏斗</text>
    <path d="M648 104l-34 12" stroke="#7dd3fc" stroke-opacity=".45" stroke-dasharray="2 3"/>
  </g>

  <!-- trajectory -->
  <g>
    <path d="M522 250c68-22 118-52 182-92" fill="none" stroke="url(#trajectory)" stroke-width="2" class="dash"/>
    <g fill="#f6fbff">
      <circle cx="560" cy="236" r="4.4" opacity=".55"/>
      <circle cx="616" cy="212" r="4.1" opacity=".35"/>
      <circle cx="666" cy="186" r="3.6" opacity=".2"/>
    </g>
    <path d="M704 158l22-10-14 20" fill="none" stroke="#ff6b1a" stroke-opacity=".5"/>
  </g>

  <!-- callouts -->
  <g class="label" font-size="10.5" fill="#8fb3cd">
    <text x="556" y="316" fill="#ff9a5c">02 摩擦发射轮</text>
    <path d="M552 311l-48-44" stroke="#ff6b1a" stroke-opacity=".45" stroke-dasharray="2 3"/>
    <text x="180" y="300">03 舵机云台</text>
    <path d="M244 297l76-9" stroke="#7dd3fc" stroke-opacity=".4" stroke-dasharray="2 3"/>
    <text x="180" y="430">04 触屏控制</text>
    <path d="M244 424l-6-52" stroke="#7dd3fc" stroke-opacity=".4" stroke-dasharray="2 3"/>
  </g>

  <!-- width dimension -->
  <g stroke="#38bdf8" stroke-opacity=".4" stroke-width="1">
    <line x1="150" y1="524" x2="570" y2="524" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="150" y1="473" x2="150" y2="530"/>
    <line x1="570" y1="473" x2="570" y2="530"/>
  </g>
  <text x="360" y="542" class="label" font-size="9.5" fill="#7d9db8" text-anchor="middle" letter-spacing="1">W 420</text>

  <!-- title block -->
  <g>
    <rect x="592" y="502" width="166" height="56" fill="#081625" fill-opacity=".9" stroke="#7dd3fc" stroke-opacity=".28"/>
    <line x1="592" y1="524" x2="758" y2="524" stroke="#7dd3fc" stroke-opacity=".2"/>
    <line x1="700" y1="524" x2="700" y2="558" stroke="#7dd3fc" stroke-opacity=".2"/>
    <text x="600" y="518" class="label" font-size="9" fill="#e6f3ff" letter-spacing="1">PB-01</text>
    <text x="600" y="540" class="label" font-size="7.5" fill="#7d9db8">SCALE 1:8</text>
    <text x="600" y="552" class="label" font-size="7.5" fill="#7d9db8">REV. A</text>
    <text x="708" y="540" class="label" font-size="7.5" fill="#7d9db8">DIY WORKSHOP</text>
    <text x="708" y="552" class="label" font-size="7.5" fill="#7d9db8">2026 / CN</text>
  </g>

  <!-- registration marks -->
  <g stroke="#7dd3fc" stroke-opacity=".28">
    <path d="M742 120h14M749 113v14"/>
    <circle cx="58" cy="330" r="3" fill="none"/>
    <circle cx="58" cy="330" r="8" fill="none" stroke-opacity=".12"/>
  </g>
</svg>
